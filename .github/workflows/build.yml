name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ArgentiCam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ArgentiCam-debug-apk
          path: ArgentiCam.apk

      # Sur la branche principale : publie l'APK dans une release "latest" téléchargeable.
      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ArgentiCam (dernière version)
          body: "APK de debug, installable directement sur Android (autoriser les sources inconnues)."
          files: ArgentiCam.apk
          make_latest: true
